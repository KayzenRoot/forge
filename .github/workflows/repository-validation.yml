name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate canonical foundation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md AGENTS.md
            .engineering/SOURCE-HIERARCHY.md
            .engineering/PROJECT-OVERVIEW.md
            .engineering/REQUIREMENTS.md
            .engineering/SCOPE.md
            .engineering/ARCHITECTURE.md
            .engineering/SECURITY.md
            .engineering/TEST-BENCHMARK-PLAN.md
            .engineering/DEPLOYMENT.md
            .engineering/BACKLOG.md
            .engineering/DEFINITION-OF-DONE.md
            .engineering/DECISIONS.md
            .engineering/CODEX-PROMPT-POLICY.md
            .engineering/CHECKPOINT.md
            .engineering/CHECKPOINT.json
            .engineering/gef/GEF-ADOPTION.md
            .engineering/hive/HIVE-INTEGRATION.md
          )
          for f in "${required[@]}"; do test -s "$f" || { echo "Missing/empty: $f"; exit 1; }; done
          python - <<'PY'
          import json, pathlib, re, sys

          ROOT = pathlib.Path(".")
          ENGINEERING = ROOT / ".engineering"

          def read(rel):
              return (ROOT / rel).read_text(encoding="utf-8")

          TOKEN = re.compile(r"^[A-Z][A-Z0-9]*(?:_[A-Z0-9]*)*$")
          RISKS = {"LOW", "STANDARD", "HIGH", "CRITICAL"}
          errors = []

          def check(cond, msg):
              if not cond:
                  errors.append(msg)

          raw = json.loads(read(".engineering/CHECKPOINT.json"))
          check(isinstance(raw, dict), "CHECKPOINT.json must be a JSON object")
          if errors:
              print("\n".join(errors)); sys.exit(1)

          ck = raw
          md = read(".engineering/CHECKPOINT.md")
          state = ck.get("state")
          increment = ck.get("activeIncrement")
          authorized = ck.get("productImplementationAuthorized")

          def md_field(label):
              m = re.search(r"^\*\*" + re.escape(label) + r":\*\*\s*(.+?)\s*$", md, re.MULTILINE)
              return m.group(1).strip() if m else None

          # Schema: shape and vocabulary only. No checkpoint state is hard-coded,
          # so promotion to a new lifecycle stage never requires editing this gate.
          check(set(ck) == {"schemaVersion", "project", "state", "activeIncrement", "risk",
                            "productImplementationAuthorized", "gef", "hive", "stopCondition"},
                f"CHECKPOINT.json keys mismatch: {sorted(ck)}")
          check(ck.get("schemaVersion") == 1, "schemaVersion must be exactly 1")
          check(isinstance(state, str) and TOKEN.match(state or ""), "state must be UPPER_SNAKE token")
          check(isinstance(increment, str) and re.fullmatch(r"FGE-\d{3}", increment or ""),
                "activeIncrement must match FGE-NNN")
          check(ck.get("risk") in RISKS, "risk must be one of LOW/STANDARD/HIGH/CRITICAL")
          check(isinstance(authorized, bool), "productImplementationAuthorized must be a JSON boolean")
          check(isinstance(ck.get("stopCondition"), str) and TOKEN.match(ck.get("stopCondition") or ""),
                "stopCondition must be a non-empty UPPER_SNAKE token")
          check(isinstance(ck.get("project"), str) and ck["project"].strip(), "project must be non-empty")

          gef = ck.get("gef") or {}
          hive = ck.get("hive") or {}
          check(isinstance(gef, dict) and re.fullmatch(r"v\d+\.\d+\.\d+", str(gef.get("version") or "")),
                "gef.version must be semver tag vMAJOR.MINOR.PATCH")
          check(isinstance(gef.get("source"), str) and gef["source"].strip(), "gef.source must be non-empty")
          check(isinstance(hive.get("source"), str) and hive["source"].strip(), "hive.source must be non-empty")
          check(isinstance(hive.get("integrationState"), str)
                and TOKEN.match(hive.get("integrationState") or ""),
                "hive.integrationState must be UPPER_SNAKE token")

          # Cross-file consistency: the markdown checkpoint must not drift from the JSON one.
          check(md_field("State") == state, "CHECKPOINT.md State disagrees with CHECKPOINT.json state")
          check(md_field("Active increment") == increment,
                "CHECKPOINT.md Active increment disagrees with CHECKPOINT.json activeIncrement")
          check(md_field("Risk") == ck.get("risk"), "CHECKPOINT.md Risk disagrees with CHECKPOINT.json risk")
          check(md_field("Product implementation") == ("AUTHORIZED" if authorized else "NOT AUTHORIZED"),
                "CHECKPOINT.md Product implementation disagrees with productImplementationAuthorized")
          check("## Established" in md and "## Stop condition" in md,
                "CHECKPOINT.md must keep the Established and Stop condition sections")

          # Truthfulness: a live HIVE claim may not coexist with the bootstrap disclaimer.
          live_hive = not str(hive.get("integrationState", "")).startswith("DOCUMENTED_NOT_LIVE")
          disclaimed = "intentionally NOT claimed" in read(".engineering/hive/HIVE-INTEGRATION.md")
          check(not (live_hive and disclaimed),
                "hive.integrationState claims live validation while HIVE-INTEGRATION.md disclaims it")

          # Admission: implementation may only be authorized against an admitted Work Order.
          if authorized:
              wo = ENGINEERING / "work-orders" / f"{increment}.md"
              check(wo.is_file() and wo.stat().st_size > 0,
                    f"productImplementationAuthorized=true requires non-empty {wo.as_posix()}")

          # Backlog and identity bindings.
          check(increment in read(".engineering/BACKLOG.md"),
                "activeIncrement must be listed in BACKLOG.md")
          check(str(gef.get("version")) in read(".engineering/gef/GEF-ADOPTION.md"),
                "gef.version must be documented in GEF-ADOPTION.md")
          check(str(ck.get("project")) in read(".engineering/PROJECT-OVERVIEW.md"),
                "checkpoint project must match PROJECT-OVERVIEW.md")
          check("CODEX-PROMPT-POLICY.md" in read("AGENTS.md"),
                "AGENTS.md must bind CODEX-PROMPT-POLICY.md")

          if errors:
              print("Checkpoint validation FAILED:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print(f"Checkpoint validation OK: state={state} increment={increment} "
                f"implementation_authorized={str(authorized).lower()}")
          PY

  native-runtime:
    name: Native runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc +1.98.1 -Vv
          cargo +1.98.1 -V
      - name: Fetch locked dependencies before offline verification
        shell: bash
        run: cargo +1.98.1 fetch --locked
      - name: Format, lint, and run the complete offline workspace suite
        shell: bash
        run: |
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 clippy --workspace --all-targets --locked --offline -- -A clippy::pedantic -D warnings
          cargo +1.98.1 test --workspace --locked --offline
          cargo +1.98.1 build -p forge-cli --release --locked --offline
      - name: Prove native doctor with outbound network blocked (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rule="forge-m00-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo iptables -I OUTPUT 1 -m comment --comment "$rule-v4" -j DROP
          sudo ip6tables -I OUTPUT 1 -m comment --comment "$rule-v6" -j DROP
          sudo iptables -C OUTPUT -m comment --comment "$rule-v4" -j DROP
          sudo ip6tables -C OUTPUT -m comment --comment "$rule-v6" -j DROP
          sudo iptables -S OUTPUT
          sudo ip6tables -S OUTPUT
          cleanup() {
            sudo iptables -D OUTPUT -m comment --comment "$rule-v4" -j DROP
            sudo ip6tables -D OUTPUT -m comment --comment "$rule-v6" -j DROP
          }
          trap cleanup EXIT
          report="$(./target/release/forge doctor --data-dir "$RUNNER_TEMP/forge-m00-native")"
          printf '%s\n' "$report"
          printf '%s' "$report" | python -c "import json,sys; r=json.load(sys.stdin); assert r['state']=='native_ready'; assert r['offline_ready'] is True; assert r['optional_services']['hive']=='not_configured'; assert r['semantic_embeddings']=='disabled'"
          FORGE_EXPECT_BLOCKED_EGRESS=1 python .engineering/scripts/test_zdrp_scenarios.py ./target/release/forge
      - name: Prove native doctor with outbound network blocked (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rule = "forge-m00-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $binary = Join-Path $PWD "target\release\forge.exe"
          $python = (& python -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path -LiteralPath $python)) { throw "Python executable path is unavailable" }
          try {
            New-NetFirewallRule -DisplayName "${rule}-forge" -Direction Outbound -Action Block -Program $binary -Profile Any | Out-Null
            New-NetFirewallRule -DisplayName "${rule}-python" -Direction Outbound -Action Block -Program $python -Profile Any | Out-Null
            $activeRules = @(Get-NetFirewallRule -DisplayName "${rule}-forge", "${rule}-python" -ErrorAction Stop)
            if ($activeRules.Count -ne 2 -or @($activeRules | Where-Object { $_.Enabled -ne "True" -or $_.Direction -ne "Outbound" -or $_.Action -ne "Block" }).Count -ne 0) { throw "Outbound block rules are not active for Forge and the scenario runner" }
            $reportText = & $binary doctor --data-dir (Join-Path $env:RUNNER_TEMP "forge-m00-native")
            if ($LASTEXITCODE -ne 0) { throw "forge doctor exited $LASTEXITCODE" }
            $reportText
            $report = $reportText | ConvertFrom-Json
            if ($report.state -ne "native_ready" -or -not $report.offline_ready -or $report.optional_services.hive -ne "not_configured" -or $report.optional_services.core -ne "not_configured" -or $report.optional_services.hades -ne "not_configured" -or $report.optional_services.iris -ne "not_configured" -or $report.optional_services.remote_telemetry -ne "not_configured" -or $report.optional_services.llm -ne "not_configured" -or $report.optional_services.provider -ne "not_configured" -or $report.semantic_embeddings -ne "disabled") { throw "Native readiness report did not satisfy the expected offline contract" }
            $env:FORGE_EXPECT_BLOCKED_EGRESS = "1"
            python .engineering/scripts/test_zdrp_scenarios.py $binary
            if ($LASTEXITCODE -ne 0) { throw "Six S21 offline readiness scenarios failed with exit $LASTEXITCODE" }
          } finally {
            Remove-NetFirewallRule -DisplayName "${rule}-forge" -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName "${rule}-python" -ErrorAction SilentlyContinue
          }

  security-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustc +1.98.1 -Vv
      - name: Install dependency policy tools
        run: |
          cargo +1.98.1 install cargo-deny --version 0.20.2 --locked
          cargo +1.98.1 install cargo-audit --version 0.22.2 --locked
      - name: Check dependency bans, sources, licenses, and advisories
        run: cargo +1.98.1 deny check
      - name: Check RustSec advisories
        run: cargo +1.98.1 audit --deny warnings
