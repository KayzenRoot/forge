[workspace]
resolver = "2"
members = [
    "crates/forge-contracts",
    "crates/forge-state",
    "crates/forge-kernel",
    "crates/forge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
blake3 = "1.8.7"
forge-contracts = { path = "crates/forge-contracts", version = "0.1.0" }
forge-kernel = { path = "crates/forge-kernel", version = "0.1.0" }
forge-state = { path = "crates/forge-state", version = "0.1.0" }
jsonschema = { version = "0.57.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
